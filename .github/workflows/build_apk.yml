name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Structure
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.example

      - name: Enable Desugaring in Kotlin DSL
        run: |
          python3 -c '
          path = "android/app/build.gradle.kts"
          with open(path, "r") as f:
              content = f.read()

          target_compile = "compileOptions {"
          replace_compile = "compileOptions {\n        isCoreLibraryDesugaringEnabled = true"
          content = content.replace(target_compile, replace_compile, 1)

          dep_block = """
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }
          """
          content += dep_block

          with open(path, "w") as f:
              f.write(content)
          '

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jamia-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
